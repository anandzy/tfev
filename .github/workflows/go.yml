name: Build & Release

on:
  push:
    branches:
      - 'feature/*'   # Runs on pushes to feature/* branches

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build Linux binary
        run: GOOS=linux GOARCH=amd64 go build -o filtervars-linux-amd64 main.go

      - name: Build macOS binary
        run: GOOS=darwin GOARCH=amd64 go build -o filtervars-darwin-amd64 main.go

      - name: Build Windows binary
        run: GOOS=windows GOARCH=amd64 go build -o filtervars-windows-amd64.exe main.go

      - name: Archive release assets
        run: |
          mkdir release
          mv filtervars-* release/
          ls -lh release

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: feature-${{ github.head_ref || github.ref_name }}-${{ github.run_number }}
          name: "Feature Build: ${{ github.head_ref || github.ref_name }} Run #${{ github.run_number }}"
          prerelease: true
          body: |
            Automated build from branch ${{ github.ref_name }}, run #${{ github.run_number }}.
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}