name: Build & Serial Release

on:
  push:
    branches:
      - 'feature/*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build Linux binary
        run: GOOS=linux GOARCH=amd64 go build -o filtervars main.go

      - name: Determine next serial release number
        id: serial
        run: |
          latest=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("serial-")) | .tagName' | sed 's/serial-//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=1
          else
            next=$((latest + 1))
          fi
          echo "serial_number=$next" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug tag
        run: echo "Next serial tag is serial-${{ steps.serial.outputs.serial_number }}"

      - name: Create Serial Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: serial-${{ steps.serial.outputs.serial_number }}
          name: "Serial Release ${{ steps.serial.outputs.serial_number }}"
          prerelease: false
          body: |
            Automated build for serial release ${{ steps.serial.outputs.serial_number }}.
          files: filtervars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}