name: Build & Daily Release

on:
  push:
    branches:
      - 'feature/*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on:
      - self-hosted
      - macOS
      - ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build Linux binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o filtervars main.go

      # 1) Figure out today’s YYMMDD tag
      - name: Determine release date
        id: release_date
        run: |
          # use UTC to keep it consistent across timezones
          echo "dateTag=$(date -u +'%y%m%d')" >> $GITHUB_OUTPUT

      # 2) Create or update the GitHub Release
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_date.outputs.dateTag }}
          name: ${{ steps.release_date.outputs.dateTag }}
          body: |
            Automated build for release ${{ steps.release_date.outputs.dateTag }}.
          files: filtervars
          # overwrite_files=true will replace the old asset if it already exists
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}